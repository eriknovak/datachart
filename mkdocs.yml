site_name: datachart
site_author: Erik Novak
site_description: >-
  Data visualization package, simple to use, highly customizable

site_url: https://eriknovak.github.io/datachart/

repo_name: eriknovak/datachart
repo_url: https://github.com/eriknovak/datachart

# internal records (ADRs, agent docs) and build hooks never ship with the site
exclude_docs: |
  adr/
  agents/
  hooks/

# fails the build when a nav page is missing from llmstxt sections (ADR 0016)
hooks:
  - docs/hooks/llmstxt_guard.py

theme:
  name: material
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  logo: assets/imgs/logo.png
  favicon: assets/imgs/favicon.png

edit_uri: ""

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - css/extra.css

plugins:
  - autorefs
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocs-jupyter:
      # cells tagged `remove_input` still execute; only their source is hidden
      remove_tag_config:
        remove_input_tags:
          - remove_input
  # redirects must come after mkdocs-jupyter so notebook pages are registered
  - redirects:
      # keys are .md stand-ins for the renamed notebooks' old URLs
      redirect_maps:
        how-to-guides/utility/overlay.md: how-to-guides/utility/panel.ipynb
        how-to-guides/config.md: how-to-guides/styling/config.ipynb
        how-to-guides/themes.md: how-to-guides/styling/themes.ipynb
        how-to-guides/theme-gallery.md: how-to-guides/styling/theme-gallery.ipynb
        how-to-guides/highlighting.md: how-to-guides/styling/highlighting.ipynb
        how-to-guides/colormaps.md: how-to-guides/styling/colormaps.ipynb
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 3
            members_order: "source"
            show_source: false
            show_labels: false
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            annotations_path: source
            docstring_section_style: spacy
  # generates llms.txt, llms-full.txt, and per-page .md endpoints (ADR 0016)
  - llmstxt:
      full_output: llms-full.txt
      preprocess: docs/hooks/llmstxt_preprocess.py
      markdown_description: |
        datachart is a Python data visualization package built on matplotlib.
        It provides simple chart functions (BarChart, LineChart, StackedAreaChart, ScatterChart,
        Histogram, Heatmap, ContourChart, HexbinChart, BoxPlot, ViolinPlot, SwarmPlot, RaincloudPlot,
        ParallelCoords, PyramidChart, RadialChart), figure
        composition via Panel (overlaying charts on shared axes) and Grid
        (arranging charts in a grid), and a global configuration system with
        predefined themes.

        Install with `pip install datachart`. All charts return a matplotlib
        Figure. Style is controlled globally via `datachart.config.config` and
        themes; per-chart overrides go in each chart's `style` parameter.
      sections:
        Getting Started:
          - index.md: Package overview, installation, and a first example.
          - how-to-guides/index.md: "Map of the guide sections: charts, composition & utilities, styling."
        Charts:
          - how-to-guides/charts/index.md: The chart functions, their common data format, and how to save figures.
          - how-to-guides/charts/linechart.ipynb: Line chart input attributes, single and multiple datasets, customization, and saving.
          - how-to-guides/charts/stackedareachart.ipynb: Stacked area chart input attributes, baselines (zero, percent, sym, wiggle), band style and outlines, emphasis, subplots, composing with Panel and Grid, and saving.
          - how-to-guides/charts/barchart.ipynb: Bar chart input attributes, single and multiple datasets, customization, and saving.
          - how-to-guides/charts/pyramidchart.ipynb: Pyramid chart input attributes, the two-sides data contract, mirrored value axis controls, and composing pyramids with Grid.
          - how-to-guides/charts/radialchart.ipynb: Radial chart input attributes, the line, bar, scatter, and histogram visuals, and polar settings (start angle, direction, inner radius).
          - how-to-guides/charts/histogram.ipynb: Histogram input attributes, single and multiple datasets, and histogram views.
          - how-to-guides/charts/boxplot.ipynb: Box plot input attributes and customization, composing boxes with swarm and violin plots; multiple datasets require subplots.
          - how-to-guides/charts/violinplot.ipynb: Violin plot input attributes, inner marks, bandwidth, split violins, composing violins with box and swarm plots, and subplots.
          - how-to-guides/charts/swarmplot.ipynb: Swarm plot input attributes, swarm and strip modes, emphasis, overlaying box and violin plots with Panel, multiple datasets, and saving.
          - how-to-guides/charts/raincloudplot.ipynb: Raincloud plot input attributes, the cloud, rain, and box parts and their styles, bandwidth, rain modes, orientation, emphasis, subplots, composing with Panel and Grid, and saving.
          - how-to-guides/charts/scatterchart.ipynb: Scatter chart input attributes, single and multiple datasets, customization, and saving.
          - how-to-guides/charts/heatmap.ipynb: Heatmap input attributes, single and multiple datasets, customization, and saving.
          - how-to-guides/charts/contourchart.ipynb: Contour chart input attributes, iso-lines and filled bands, colorbars, inline labels, level rules, emphasis, multiple surfaces, composing with Panel and Grid, and saving.
          - how-to-guides/charts/hexbinchart.ipynb: Hexbin chart input attributes, point counts and log color scales, aggregating a per-point value, grid size and minimum count, hexagon edges, subplots, composing with Panel and Grid, and saving.
          - how-to-guides/charts/parallelcoords.ipynb: Parallel coordinates input attributes and customization for multivariate data.
        Composition & Utilities:
          - how-to-guides/utility/index.md: Map of Panel, Grid, statistics, and figure saving.
          - how-to-guides/utility/panel.ipynb: "Overlaying multiple charts on one plot with Panel: dual y-axes, z-order, emphasis, and nesting panels."
          - how-to-guides/utility/grid.ipynb: Arranging multiple charts in a grid layout with Grid, including nested rows and layout specs.
          - how-to-guides/utility/annotations.ipynb: "Text annotations on any chart: placement and coordinates, connector looks, text and box styling, and annotating finished figures with Annotate."
          - how-to-guides/utility/stats.ipynb: Statistical utilities for preparing chart data.
        Styling:
          - how-to-guides/styling/index.md: Map of configuration, themes, emphasis, and colormaps.
          - how-to-guides/styling/config.ipynb: "Customizing the global style via the config singleton: set_theme, update_config, reset_config."
          - how-to-guides/styling/themes.ipynb: Applying the predefined themes and creating custom ones.
          - how-to-guides/styling/theme-gallery.ipynb: Every predefined theme rendered across the chart types.
          - how-to-guides/styling/highlighting.ipynb: Emphasizing and muting data series with the emphasis option.
          - how-to-guides/styling/colormaps.ipynb: The colormaps available via the COLORS constant.
        API Reference:
          - references/index.md: Top-level module reference.
          - references/charts.md: Chart function signatures and parameters.
          - references/utils/index.md: Panel, Grid, and save_figure signatures.
          - references/utils/stats.md: Statistical function signatures.
          - references/config.md: The Config class and the global config instance.
          - references/themes.md: The predefined theme dictionaries.
          - references/constants.md: Enums and constants (THEME, FIG_SIZE, ORIENTATION, COLORS, ...).
          - references/typings.md: TypedDict definitions for chart data and style attributes.

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji

nav:
  - Home: index.md

  - How-To Guides:
    - how-to-guides/index.md
    - Charts:
      - how-to-guides/charts/index.md
      # trends and comparisons
      - Line Chart: how-to-guides/charts/linechart.ipynb
      - Stacked Area Chart: how-to-guides/charts/stackedareachart.ipynb
      - Bar Chart: how-to-guides/charts/barchart.ipynb
      - Pyramid Chart: how-to-guides/charts/pyramidchart.ipynb
      - Radial Chart: how-to-guides/charts/radialchart.ipynb
      # distributions
      - Histogram: how-to-guides/charts/histogram.ipynb
      - Box Plot: how-to-guides/charts/boxplot.ipynb
      - Violin Plot: how-to-guides/charts/violinplot.ipynb
      - Swarm Plot: how-to-guides/charts/swarmplot.ipynb
      - Raincloud Plot: how-to-guides/charts/raincloudplot.ipynb
      # relationships
      - Scatter Chart: how-to-guides/charts/scatterchart.ipynb
      - Heatmap: how-to-guides/charts/heatmap.ipynb
      - Contour Chart: how-to-guides/charts/contourchart.ipynb
      - Hexbin Chart: how-to-guides/charts/hexbinchart.ipynb
      - Parallel Coordinates: how-to-guides/charts/parallelcoords.ipynb
    - Composition & Utilities:
      - how-to-guides/utility/index.md
      - Panel: how-to-guides/utility/panel.ipynb
      - Grid: how-to-guides/utility/grid.ipynb
      - Text Annotations: how-to-guides/utility/annotations.ipynb
      - Statistics: how-to-guides/utility/stats.ipynb
    - Styling:
      - how-to-guides/styling/index.md
      - Config: how-to-guides/styling/config.ipynb
      - Themes: how-to-guides/styling/themes.ipynb
      - Theme Gallery: how-to-guides/styling/theme-gallery.ipynb
      - Highlighting: how-to-guides/styling/highlighting.ipynb
      - Colormaps: how-to-guides/styling/colormaps.ipynb


  - API Reference:
    - references/index.md
    - charts: references/charts.md
    - utils:
      - references/utils/index.md
      - stats: references/utils/stats.md
    - config: references/config.md
    - themes: references/themes.md
    - constants: references/constants.md
    - typings: references/typings.md


  - Changelog: changelog.md
  - Development: development.md
