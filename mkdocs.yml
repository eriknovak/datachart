site_name: datachart
site_author: Erik Novak
site_description: >-
  Data visualization package, simple to use, highly customizable

site_url: https://eriknovak.github.io/datachart/

repo_name: eriknovak/datachart
repo_url: https://github.com/eriknovak/datachart

# internal records (ADRs, agent docs) and build hooks never ship with the site
exclude_docs: |
  adr/
  agents/
  explorer/
  hooks/
  overrides/

hooks:
  # fails the build when a nav page is missing from llmstxt sections (ADR 0016)
  - docs/hooks/llmstxt_guard.py
  # notebook kernels read docs/hooks/jupyter_nbconvert_config.py
  - docs/hooks/nbconvert_config.py

theme:
  name: material
  # home.html: the landing page template (hero and chart marquees)
  custom_dir: docs/overrides
  features:
    - content.code.copy
    - content.code.annotate
    - content.tooltips
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    # Palette toggle for light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Palette toggle for dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  logo: assets/imgs/logo.png
  favicon: assets/imgs/favicon.png

edit_uri: ""

extra:
  version:
    provider: mike
    default: latest

extra_css:
  - css/extra.css

# LaTeX in docstrings (the NETWORK_LAYOUT pull equation) via arithmatex
extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - autorefs
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocs-jupyter:
      # notebooks run at build time, so the site never shows committed outputs
      # that predate a library change; runs are cached by notebook content
      # under .cache/mkdocs-jupyter — clear it after changing datachart
      execute: true
      allow_errors: false
      # notebooks only: the docs asset scripts are not pages
      include: ["*.ipynb"]
      # cells tagged `remove_input` still execute; only their source is hidden
      remove_tag_config:
        remove_input_tags:
          - remove_input
  # redirects must come after mkdocs-jupyter so notebook pages are registered
  - redirects:
      # keys are .md stand-ins for the renamed notebooks' old URLs
      redirect_maps:
        how-to-guides/utility/overlay.md: how-to-guides/utility/panel.ipynb
        how-to-guides/config.md: how-to-guides/styling/themes.ipynb
        how-to-guides/styling/config.md: how-to-guides/styling/themes.ipynb
        how-to-guides/themes.md: how-to-guides/styling/themes.ipynb
        how-to-guides/theme-gallery.md: how-to-guides/styling/theme-gallery.ipynb
        how-to-guides/highlighting.md: how-to-guides/styling/highlighting.ipynb
        how-to-guides/colormaps.md: how-to-guides/styling/colormaps.ipynb
  - mkdocstrings:
      handlers:
        python:
          options:
            heading_level: 3
            members_order: "source"
            show_source: false
            show_labels: false
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_toc: true
            show_symbol_type_heading: true
            show_signature_annotations: true
            separate_signature: true
            annotations_path: source
            docstring_section_style: spacy
            modernize_annotations: true
            signature_crossrefs: true
  # generates llms.txt, llms-full.txt, and per-page .md endpoints (ADR 0016)
  - llmstxt:
      full_output: llms-full.txt
      preprocess: docs/hooks/llmstxt_preprocess.py
      markdown_description: |
        datachart is a Python data visualization package built on matplotlib.
        It provides simple chart functions (BarChart, LineChart, StackedAreaChart, BumpChart, ScatterChart,
        Histogram, Heatmap, ContourChart, HexbinChart, BoxPlot, ViolinPlot, SwarmPlot, RaincloudPlot,
        RidgelinePlot,
        ParallelCoords, PyramidChart, RadialChart, CalendarHeatmap, GanttChart, DumbbellChart, SankeyChart, NetworkChart,
        ScatterMatrix,
        Treemap), figure
        composition via Panel (overlaying charts on shared axes) and Grid
        (arranging charts in a grid), and a global configuration system with
        predefined themes.

        Install with `pip install datachart`. All charts return a matplotlib
        Figure. Style is controlled globally via `datachart.config.config` and
        themes; per-chart overrides go in each chart's `style` parameter.
      sections:
        Getting Started:
          - index.md: Landing page with a chart gallery, links to the guides and reference, installation, and a first example.
          - ai-assistants.md: "Pointing an AI coding assistant at these docs: llms.txt and per-page markdown, the Context7 and GitMCP servers, and a project-rules snippet describing the package."
          - how-to-guides/index.md: "Map of the guide sections: charts, composition, styling, utility."
        Charts:
          - how-to-guides/charts/index.md: Map of the chart guides by family, with Panel and Grid support per chart, and the highlighting guide.
          - how-to-guides/charts/linechart.ipynb: Line chart basics on the global temperature record, line and area style, value labels, reference lines and bands, annotations, several series with emphasis, legend and confidence bands, subplots, datetime axes, axis scales, and worked examples on real data.
          - how-to-guides/charts/stackedareachart.ipynb: Stacked area chart basics on world electricity generation by source, legend, band style, zero, percent and streamgraph baselines, value labels, emphasis, reference lines and bands, subplots, Panel and Grid composition, and worked examples on real data.
          - how-to-guides/charts/bumpchart.ipynb: Bump chart basics on world population ranks, ranking by value or given ranks, ties and gaps, end labels, curved lines, value labels, emphasis, reference bands, Panel and Grid composition, and worked examples on real data.
          - how-to-guides/charts/barchart.ipynb: Bar chart basics on the Paris 2024 medal table, horizontal bars, sorting, value labels, emphasis, reference lines and bands, annotations, date labels, grouped, stacked and overlaid series, legend, subplots, error bars, axis scales, and worked examples on real data.
          - how-to-guides/charts/pyramidchart.ipynb: Pyramid chart basics on an ageing population by age and sex, naming the sides, mirrored value axis range and ticks, value labels, sorting, emphasis, reference lines and bands, error bars, date labels, custom data keys, and Grid comparisons of young and ageing populations.
          - how-to-guides/charts/radialchart.ipynb: Radial chart basics on a year of coastal weather data, the line, bar, scatter and histogram visuals, start angle and direction, donut holes, sorting and emphasis, tip values and labels, wedge and ring bands, bar modes, subplots, error bands, log radius, and worked examples with Grid and Panel.
          - how-to-guides/charts/ganttchart.ipynb: Gantt chart basics on an illustrative house build, date windows and calendar periods, row order, groups and group headers, milestones, progress and duration labels, dependency arrows, the today line, reference lines, notes, emphasis on the critical path, plan against forecast, Grid composition, and worked examples on a sprint, a research grant, and a product launch.
          - how-to-guides/charts/dumbbellchart.ipynb: Dumbbell chart basics on WHO life expectancy data, orientation, sorting by start, end, or change, endpoint names and legend, endpoint and delta value labels, direction arrows, markers and connectors, emphasis rules, reference lines, text notes, overlaid and subplot charts, Panel and Grid composition, and worked examples on real data.
          - how-to-guides/charts/calendarheatmap.ipynb: Calendar heatmap basics on daily cyclist counts, week start, month and weekday labels, colorbar and cell values, calendar style, normalization, emphasis, text notes, one calendar per year and the year filter, multiple datasets, Grid composition, themes, and worked examples on illustrative daily data.
          - how-to-guides/charts/histogram.ipynb: Histogram basics on Palmer penguin flipper lengths, choosing the number of bins, bar and step styles, orientation, value labels, reference lines and bands, text notes, stacked and overlaid series, emphasis rules, legend, shared subplots, density, density-curve and cumulative views, log count axes, custom data keys, and worked examples on marathon times, an A/B test, and request latency.
          - how-to-guides/charts/boxplot.ipynb: Box plot basics on the Palmer penguins, axis ticks and formats, box order, box style, horizontal boxes, outliers, notched boxes and median differences, median labels, emphasis rules, reference lines and bands, text notes, date labels, swarms and violins with Panel, subplots with shared axes, log scales, custom data keys, and worked examples with Grid.
          - how-to-guides/charts/violinplot.ipynb: Violin plot basics on the Palmer penguins, inner marks, bandwidth, split violins, legend, median labels, violin style, horizontal violins, emphasis and emphasis rules, reference lines and bands, text notes, date labels, box and swarm overlays with Panel, subplots with shared axes, log scales, custom data keys, and worked examples on real and illustrative data.
          - how-to-guides/charts/swarmplot.ipynb: Swarm plot basics on the ages of US presidents at inauguration, point style, swarm and strip modes, horizontal swarms, min, median and max labels, group and single-point emphasis, reference lines and bands, named points, date labels, swarms over boxes and violins, overlaid and subplot series, log scale, and worked examples on real and illustrative data.
          - how-to-guides/charts/raincloudplot.ipynb: Raincloud plot basics on the Palmer penguins, cloud, rain and box style, cloud bandwidth, swarm and strip rain, box outliers, value labels, horizontal rainclouds, emphasis and emphasis rules, reference lines and bands, text notes, date labels, legend, subplots, Panel and Grid composition, log scale, custom data keys, and worked examples on reaction times, test scores, and delivery times.
          - how-to-guides/charts/ridgelineplot.ipynb: Ridgeline plot basics on a year of daily temperatures in Ljubljana, ridge style, row overlap, per-row and common density scales, median and quartile marks, fill and outline, sorting by median, bandwidth, the shared value range, orientation, emphasis rules, reference lines and bands, legend, text notes, subplots, Panel and Grid composition, and worked examples on illustrative data.
          - how-to-guides/charts/scatterchart.ipynb: Scatter chart basics on WHO life expectancy and World Bank GDP per capita, log axes and tick labels, marker style, hue grouping, bubble sizes, point and value labels, error bars from symmetric and asymmetric distances, regression lines with confidence bands and correlation, equal aspect ratio, emphasis and emphasis rules, reference lines and bands, text notes, legend, shared subplots, datetime axis, custom data keys, and worked examples with Panel on real and illustrative data.
          - how-to-guides/charts/heatmap.ipynb: Heatmap basics on the monthly climate of six cities, tick labels, square cells, colorbar placement and cell values, sequential and diverging colormaps, value ranges and log-style normalization, emphasis rules and grids, text notes, multiple heatmaps with shared axes, blank cells, axis ranges, date labels, and worked examples on real and illustrative data.
          - how-to-guides/charts/contourchart.ipynb: Contour chart basics on an illustrative two-peak hill, tick formats, equal aspect ratio, filled bands and colorbars, inline labels, level counts, lists and rules, contour style and colormaps, normalization, reference lines and bands, landmark notes, overlaid seasonal densities, legend, emphasis and emphasis rules, shared-level subplots, Panel and Grid composition, 2-D density estimates, log axes, a datetime axis, and worked examples on real data.
          - how-to-guides/charts/hexbinchart.ipynb: Hexbin chart basics on illustrative apartment listings, from an overplotted scatter to hexagon counts, axis ticks and formats, colorbar label and placement, grid size, minimum count, log normalization, aggregating a per-point value, hexagon style, emphasis rules, reference lines and bands, text notes, subplots with a shared color range, Panel and Grid composition, equal aspect, datetime axis, themes, and worked examples.
          - how-to-guides/charts/sankeychart.ipynb: Sankey chart basics on an illustrative national energy flow, the links data contract, inferred and explicit node columns, column labels, ribbon values and value formats, ribbons colored by source, target or grey, node width, gaps, stroke and outlines, label halos, text notes, subplots, Grid composition, themes, and worked examples on annotator agreement, a signup funnel, and the Titanic.
          - how-to-guides/charts/networkchart.ipynb: Network chart basics on the Florentine families marriage network, node labels and label positions, spring, circular and fixed layouts, large networks, directed edges, edge weights and node sizes, groups and the grouped layout, per-node emphasis and emphasis rules, edge values, node and edge style, text notes, subplots, Grid composition, themes, and worked examples on code reviews and container traffic.
          - how-to-guides/charts/treemap.ipynb: Treemap basics on world population by continent and country, flat and nested groups, tile values and shares, per-record emphasis and emphasis rules, the group legend, tile style, text annotations, subplots, composing with Grid, themes, and worked examples on real data.
          - how-to-guides/charts/parallelcoords.ipynb: Parallel coordinates basics on the Palmer penguins, choosing and ordering dimensions, categorical and numeric hue, category order, legend, line, axis, tick and dimension label style, emphasis and emphasis rules, text notes, overlaid sets with per-set style and hue, date dimensions, and worked examples on car specs, a hyperparameter search, and a Grid of species profiles.
          - how-to-guides/styling/highlighting.ipynb: Emphasizing and muting data series on any chart with the emphasis option, by role or by rule.
          - how-to-guides/charts/scattermatrix.ipynb: Scatter matrix basics on the Palmer penguins, columns or records, selecting dimensions, hue groups and the single legend, histogram, density or blank diagonals, the lower triangle, correlation text and Simpson's paradox, regression lines, shared axes, grid lines, scatter matrix style, Grid composition, themes, and worked examples on real and illustrative data.
        Composition:
          - how-to-guides/composition/index.md: Map of Panel, Grid, and text annotations with Annotate.
          - how-to-guides/utility/panel.ipynb: "Overlaying charts in one coordinate space with Panel: two value axes, legend, drawing order, emphasis, limits and scales, bar mode, nesting, horizontal panels, configuration, and worked examples."
          - how-to-guides/utility/grid.ipynb: Grid basics on the climate of Ljubljana and eight European cities, titles and shared axis labels, figure size, automatic layout, nested rows, blank cells, shared axes, irregular layouts, nested grids and panels, subplot figures, annotations, and worked examples on real data.
          - how-to-guides/utility/annotations.ipynb: Text annotation basics on Ljubljana's climate normals, data and axes coordinates, targets and connectors, connector looks, text and box style, per-subplot notes, annotating finished figures, panels and subplots with Annotate, the text configuration, and worked examples on real data.
        Styling:
          - how-to-guides/styling/index.md: Map of themes, the theme gallery, and colormaps.
          - how-to-guides/styling/themes.ipynb: "Applying the predefined themes through the config singleton, what a theme controls, building a custom theme with register_theme, deriving a theme variant from a colormap with derive_theme, and sharing it as a JSON theme file."
          - how-to-guides/styling/theme-gallery.ipynb: Each predefined theme's swatches with hex codes and six signature charts, grouped by use.
          - how-to-guides/styling/colormaps.ipynb: "Every COLORS palette as a strip and six-series swatches, grouped by kind, with chips for the predefined themes that use it and the role; which kind fits which theme attribute."
        Utility:
          - how-to-guides/utility/index.md: Map of the statistics, figure saving, and interactive figure guides.
          - how-to-guides/utility/stats.ipynb: "Statistics basics on the Palmer penguins: centers, spreads, shape, correlation, trend lines, bootstrap intervals, binning, smoothers on the NASA temperature record, density estimates, each fed back into a chart, and worked examples on real data."
          - how-to-guides/utility/saving.md: "Saving figures with save_figure: vector or raster formats and dpi, transparent backgrounds, several formats in one call, embedding SVG or PNG in web pages, and worked examples for a manuscript, a slide, and a documentation page."
          - how-to-guides/utility/interactive.md: "Zooming, panning, and hovering over marks with show(interactive=True): the interactive extra, notebook and script behavior, what the hover annotation of every chart type shows, and worked examples for finding an outlier, reading a two-axis panel, and checking a grid."
        Use Cases:
          - use-cases/index.md: "Map of the use-case pages: one field per page, each a dataset walked from the first figure to the last."
          - use-cases/ai-ml-nlp.ipynb: The figures of a model report on an illustrative experiment log, from training curves, a hyperparameter sweep and a confusion matrix through ROC, precision-recall and calibration to per-class scores, feature importance, a leaderboard, benchmark intervals, the corpus token statistics, and a closing paper-style panel.
          - use-cases/statistics.ipynb: The figures of a statistics report on the Palmer penguins, from group distributions with their Kruskal-Wallis and Mann-Whitney results and bootstrapped effect sizes through a correlation matrix, a scatter matrix and Simpson's paradox to a fitted line, its residuals, a Q-Q plot, the empirical distributions, and a closing report panel.
          - use-cases/biomedical.ipynb: The figures of a trial report on a simulated three-arm, 12-week study, from the endpoint per arm with pairwise brackets, bootstrapped dose-response intervals and the share at target through the mean course with confidence bands, every subject's course, and retention to a diverging heatmap of the marker panel, safety-lab dumbbells, a flagged swarm of individual liver-enzyme rises, and a closing report panel.
          - use-cases/demographics.ipynb: The figures of a population report on World Bank and Eurostat data for Slovenia and the world, from population pyramids of 1960 and 2023 side by side, the age-group shares with their crossover year and fertility against life expectancy on twin axes, through a Sankey of 2023 migration by citizenship and a heatmap of median age by region, to life-expectancy gains as dumbbells, the world's distribution as ridgelines, the Preston curve of income against longevity, and a closing report panel.
          - use-cases/business.ipynb: The figures of a product review on a simulated subscription service, from the revenue mix by plan as a stacked area, a treemap of segments and a bump chart of channel ranks, through the sign-up funnel as a Sankey, a calendar heatmap of daily sign-ups and a cohort-retention heatmap, to a Gantt roadmap and a closing review panel.
          - use-cases/economics.ipynb: The figures of an economic report on World Bank data for the major economies, from growth with recession bands, a bump chart of the largest economies and the sector shares of three economies, through an inflation heatmap, the pandemic year as sorted bars and income per head as dumbbells, to a parallel-coordinates profile of the G20 and a closing report panel.
        API Reference:
          - references/index.md: Top-level module reference, with a where-to-look table over the reference pages.
          - references/charts/index.md: Map of the chart reference pages by family, with each chart's data record, style typing, and guide.
          - references/charts/linechart.md: The LineChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/stackedareachart.md: The StackedAreaChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/bumpchart.md: The BumpChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/barchart.md: The BarChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/pyramidchart.md: The PyramidChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/radialchart.md: The RadialChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/calendarheatmap.md: The CalendarHeatmap function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/ganttchart.md: The GanttChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/dumbbellchart.md: The DumbbellChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/histogram.md: The Histogram function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/boxplot.md: The BoxPlot function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/violinplot.md: The ViolinPlot function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/swarmplot.md: The SwarmPlot function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/raincloudplot.md: The RaincloudPlot function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/ridgelineplot.md: The RidgelinePlot function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/scatterchart.md: The ScatterChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/heatmap.md: The Heatmap function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/contourchart.md: The ContourChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/hexbinchart.md: The HexbinChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/parallelcoords.md: The ParallelCoords function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/networkchart.md: The NetworkChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/scattermatrix.md: The ScatterMatrix function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/sankeychart.md: The SankeyChart function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/charts/treemap.md: The Treemap function and its parameters, its data record, the keys its style takes, and the constants its parameters accept.
          - references/utils/index.md: Panel, Grid, Annotate, and save_figure signatures, with a table of which utility fits which task.
          - references/utils/stats.md: Statistical function signatures, grouped by center, spread, shape, association, trend line, intervals, binning, smoothing, and density.
          - references/config.md: The Config class and the global config instance, with a table of which method fits which task.
          - references/themes.md: The predefined theme dictionaries, with a table of each theme's look and its THEME member.
          - references/constants.md: Enums and constants (THEME, FIG_SIZE, ORIENTATION, COLORS, ...).
          - references/typings.md: The shared TypedDict contracts, per-figure settings, shared style groups, and theme style, with a table pointing to each chart's own typings.

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - def_list
  - md_in_html
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji

