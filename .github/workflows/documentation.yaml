name: Documentation

# main -> `dev`; published releases -> `X.Y.Z` + `latest` (the site default)
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # silences the Material team's MkDocs 2.0 banner printed on every build
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: 3.12
      # the themes' Helvetica/Arial stacks fall back to this metric-compatible
      # clone when the notebooks render here
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation
      - run: uv sync --group docs
      # the outlines and faces download on first use; fetched once per key (ADR 0062, 0063)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: datachart-cache-${{ hashFiles('datachart/utils/_internal/cache.py', 'datachart/utils/_internal/basemap.py', 'datachart/utils/_internal/fonts.py') }}-fonts-110m-50m
      - run: uv run python datachart/utils/_internal/prewarm.py fonts 110m 50m
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - if: github.event_name == 'push'
        run: uv run mike deploy --push dev
      - if: github.event_name == 'release'
        run: |
          uv run mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest
          uv run mike set-default --push latest
      # mike writes only version dirs at the root; GitHub Pages serves 404.html
      # from the root alone, and llms.txt is expected at the site root (ADR 0016)
      - name: Copy latest 404 page and llms files to site root
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          cp latest/404.html latest/llms.txt latest/llms-full.txt .
          git add 404.html llms.txt llms-full.txt
          git diff --cached --quiet || git commit -m "Copy latest 404 page and llms files to site root"
          git push origin gh-pages
