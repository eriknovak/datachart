name: Documentation

# main -> `dev`; published releases -> `X.Y.Z` + `latest` (the site default)
on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --group docs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - if: github.event_name == 'push'
        run: uv run mike deploy --push dev
      - if: github.event_name == 'release'
        run: |
          uv run mike deploy --push --update-aliases "${GITHUB_REF_NAME#v}" latest
          uv run mike set-default --push latest
      # mike writes only version dirs at the root; GitHub Pages serves 404.html
      # from the root alone, and llms.txt is expected at the site root (ADR 0016)
      - name: Copy latest 404 page and llms files to site root
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          cp latest/404.html latest/llms.txt latest/llms-full.txt .
          git add 404.html llms.txt llms-full.txt
          git diff --cached --quiet || git commit -m "Copy latest 404 page and llms files to site root"
          git push origin gh-pages
