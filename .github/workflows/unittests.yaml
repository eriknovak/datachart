name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "mkdocs.yml", "docs/adr/**", "docs/agents/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "mkdocs.yml", "docs/adr/**", "docs/agents/**"]
  # a quiet week still meets the next matplotlib pre-release (ADR 0085)
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # the weekly run is for matplotlib-pre only; notebooks skip with this job
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group test
      # the outlines and faces download on first use; fetched once per key (ADR 0062, 0063)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: datachart-cache-${{ hashFiles('datachart/utils/_internal/cache.py', 'datachart/utils/_internal/basemap.py', 'datachart/utils/_internal/fonts.py') }}-fonts-110m-50m
      - run: uv run python datachart/utils/_internal/prewarm.py fonts 110m 50m
      - run: uv run python -m unittest discover test

  # early warning on the private matplotlib touchpoint; never blocks (ADR 0085)
  matplotlib-pre:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: uv sync --group test
      - run: uv pip install --prerelease allow --upgrade matplotlib
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: datachart-cache-${{ hashFiles('datachart/utils/_internal/cache.py', 'datachart/utils/_internal/basemap.py', 'datachart/utils/_internal/fonts.py') }}-fonts-110m-50m
      # --no-sync keeps the pre-release instead of restoring the locked version
      - run: uv run --no-sync python datachart/utils/_internal/prewarm.py fonts 110m 50m
      - run: uv run --no-sync python -c "import matplotlib; print(matplotlib.__version__)"
      - run: uv run --no-sync python -m unittest discover test

  notebooks:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --group test
      # the outlines and faces download on first use; fetched once per key (ADR 0062, 0063)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: datachart-cache-${{ hashFiles('datachart/utils/_internal/cache.py', 'datachart/utils/_internal/basemap.py', 'datachart/utils/_internal/fonts.py') }}-fonts-110m-50m
      - run: uv run python datachart/utils/_internal/prewarm.py fonts 110m 50m
      - run: uv run pytest
