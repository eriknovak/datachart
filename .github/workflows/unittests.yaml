name: Test

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "mkdocs.yml", "docs/adr/**", "docs/agents/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "mkdocs.yml", "docs/adr/**", "docs/agents/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group test
      # the basemap outlines download on first use; fetched once per key (ADR 0062)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: natural-earth-${{ hashFiles('datachart/utils/_internal/basemap.py') }}-110m-50m
      - run: uv run python datachart/charts/_basemap/prewarm.py 110m 50m
      - run: uv run python -m unittest discover test

  notebooks:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync --group test
      # the basemap outlines download on first use; fetched once per key (ADR 0062)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/datachart
          key: natural-earth-${{ hashFiles('datachart/utils/_internal/basemap.py') }}-110m-50m
      - run: uv run python datachart/charts/_basemap/prewarm.py 110m 50m
      - run: uv run pytest
