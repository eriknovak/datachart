name: Prewarm datachart cache
description: Restore the fonts/basemap cache and prewarm datachart's font and basemap data
inputs:
  no-sync:
    description: Pass --no-sync to uv run, to keep an already-installed environment
    required: false
    default: "false"
runs:
  using: composite
  steps:
    # the outlines and faces download on first use; fetched once per key (ADR 0062, 0063)
    - uses: actions/cache@v4
      with:
        path: ~/.cache/datachart
        key: datachart-cache-${{ hashFiles('datachart/utils/_internal/cache.py', 'datachart/utils/_internal/basemap.py', 'datachart/utils/_internal/fonts.py') }}-fonts-110m-50m
    - shell: bash
      run: uv run ${{ inputs.no-sync == 'true' && '--no-sync' || '' }} python datachart/utils/_internal/prewarm.py fonts 110m 50m
